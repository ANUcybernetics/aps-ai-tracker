name: Build and deploy site

# Rebuilds on every push to main, so each daily scrape that weddle pushes
# republishes the site. The Python exporter makes NO model calls here: it
# regenerates the gitignored JSON from the repo and the committed extraction
# caches under .cache/ (weddle runs the Claude classification and profiling
# when it scrapes). No secrets needed.

on:
  push:
    branches: [main]
    # Skip rebuilds for pushes that can't change the built site. Everything else
    # — statements/, agencies.toml, the extraction caches, the exporter, site/ —
    # still triggers a deploy. (paths-ignore skips only when EVERY changed file
    # matches, so a mixed commit still builds.) workflow_dispatch always runs.
    paths-ignore:
      - "README.md"
      - "CLAUDE.md"
      - "LICENSE"
      - ".gitignore"
      - "cron-scrape.sh"
      - "ops/**"
      - "backlog/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the timeline IS the full git history

      - name: Set up uv
        # Full version pin: setup-uv stopped publishing floating major tags
        # after v7, so @v10 fails to resolve at job setup.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"

      # This is the only place the Python tests and typecheck run automatically
      # (the nightly cron just scrapes), so keep them ahead of the export that
      # depends on that code. ty is pinned because a new release can introduce
      # new diagnostics; bump it deliberately alongside a local `uvx ty check`.
      # With the export group: the analysis modules the exporter tests import
      # need pydantic.
      - name: Python tests
        run: uv run --group export python -m pytest

      # Through the project env with the export group, so the pydantic/anthropic
      # imports in the analysis modules resolve (bare `uvx ty` sees no project
      # packages).
      - name: Python typecheck
        run: uv run --group export --with ty==0.0.75 ty check

      - name: Generate site data
        run: uv run --group export export

      # node + pnpm come from the repo-root mise.toml (pnpm = "latest"), the same
      # single-source setup the sibling benswift-me repo uses — no version pinned
      # here or in package.json.
      - name: Setup mise (node + pnpm)
        uses: jdx/mise-action@v4

      - name: Locate pnpm store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Install site deps
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Lint
        run: pnpm run lint
        working-directory: site

      - name: Lint CSS
        run: pnpm run lint:css
        working-directory: site

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: site

      - name: Test
        run: pnpm run test
        working-directory: site

      - name: Build
        run: pnpm run build
        working-directory: site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
          include-hidden-files: true # keep .nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
