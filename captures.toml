# Operator verdicts on individual captures, read by `export`.
#
# [[quarantine]]: revisions that are failed captures, not the agency changing its
# statement. The exporter drops them from the timeline before anything reads
# them, so no summary, profile delta or announcement is ever built on one.
#
# [[confirmed]]: revisions that shrank by more than half and are genuine. Any
# other revision that shrinks past CONTENT_SHRINKAGE_THRESHOLD is dropped
# automatically with a warning naming it; add it here (or above) to settle it.
#
# `sha` may be an abbreviated prefix of the statement commit.

